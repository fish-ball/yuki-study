<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中考辅导 Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <p class="brand-mark">Yuki Study</p>
        <p class="brand-sub">佛山顺德 · 2027 中考</p>
      </div>
      <nav class="nav">
        <button type="button" class="nav-item active" data-view="overview">总览</button>
        <button type="button" class="nav-item" data-view="practice">练习</button>
        <button type="button" class="nav-item" data-view="learn">学习</button>
        <button type="button" class="nav-item" data-view="history">做题记录</button>
        <button type="button" class="nav-item" data-view="knowledge">知识点</button>
        <button type="button" class="nav-item" data-view="mastery">掌握度</button>
        <button type="button" class="nav-item" data-view="assessments">考核</button>
        <button type="button" class="nav-item" data-view="plan">周计划</button>
        <button type="button" class="nav-item" data-view="profile">档案</button>
      </nav>
      <div class="sidebar-foot">
        <button type="button" id="btn-sync" class="btn-sync">从仓库同步</button>
        <p id="sync-status" class="muted"></p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">总览</h1>
        <p id="view-desc" class="muted">掌握度、知识点与考核一站浏览</p>
      </header>

      <section id="view-overview" class="view active"></section>
      <section id="view-practice" class="view"></section>
      <section id="view-learn" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-knowledge" class="view"></section>
      <section id="view-mastery" class="view"></section>
      <section id="view-assessments" class="view"></section>
      <section id="view-plan" class="view"></section>
      <section id="view-profile" class="view"></section>
    </main>
  </div>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form" class="dialog-card">
      <h2>编辑掌握度</h2>
      <p id="edit-kid" class="mono muted"></p>
      <label>等级
        <select name="level" id="edit-level">
          <option value="L0">L0 未学</option>
          <option value="L1">L1 了解</option>
          <option value="L2">L2 理解</option>
          <option value="L3">L3 掌握</option>
          <option value="L4">L4 熟练</option>
        </select>
      </label>
      <label>错误次数
        <input type="number" name="wrong_count" id="edit-wrong" min="0" step="1" />
      </label>
      <label>备注
        <textarea name="notes" id="edit-notes" rows="3"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn-ghost">取消</button>
        <button type="submit" value="save" class="btn-primary">保存并回写 YAML</button>
      </div>
    </form>
  </dialog>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
